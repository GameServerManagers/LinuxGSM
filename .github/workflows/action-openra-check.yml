name: OpenRA Update Tests

on:
  pull_request:
    paths:
      - "lgsm/modules/update_openra.sh"
      - ".github/scripts/test-update-openra.sh"
      - ".github/workflows/action-openra-check.yml"
  push:
    paths:
      - "lgsm/modules/update_openra.sh"
      - ".github/scripts/test-update-openra.sh"
      - ".github/workflows/action-openra-check.yml"

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test OpenRA update failure handling
        run: bash .github/scripts/test-update-openra.sh
