name: QuakeWorld Updater Tests

on:
  push:
    branches: [develop]
    paths:
      - "lgsm/modules/**"
      - "tests/test_update_qw.sh"
      - ".github/workflows/action-test-update-qw.yml"
  pull_request:
    paths:
      - "lgsm/modules/**"
      - "tests/test_update_qw.sh"
      - ".github/workflows/action-test-update-qw.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test QuakeWorld updater
        run: bash tests/test_update_qw.sh
