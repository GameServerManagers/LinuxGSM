name: Milestone Sync
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - edited
      - milestoned
      - closed
    branches:
      - develop

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: milestone-sync-${{ github.event.pull_request.number }}

jobs:
  milestone-sync:
    if: github.repository_owner == 'GameServerManagers'
    runs-on: ubuntu-latest
    steps:
      - name: Set PR milestone and copy it to linked issues
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const action = context.payload.action;

            if (action === 'closed' && !pr.merged) {
              return;
            }

            let milestone = pr.milestone;
            if (!milestone && ['opened', 'reopened', 'ready_for_review'].includes(action)) {
              const open = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'open', per_page: 100 });
              open.sort((a, b) => {
                if (a.due_on && b.due_on) return a.due_on.localeCompare(b.due_on);
                if (a.due_on) return -1;
                if (b.due_on) return 1;
                return a.number - b.number;
              });
              if (open.length === 0) {
                core.warning('No open milestone to assign.');
                return;
              }
              milestone = open[0];
              await github.rest.issues.update({ owner, repo, issue_number: pr.number, milestone: milestone.number });
              core.info(`Set PR #${pr.number} milestone to ${milestone.title}.`);
            }
            if (!milestone) {
              core.info('PR has no milestone; nothing to copy to issues.');
              return;
            }

            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const issueRef = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|related to):?\s+(?:([\w.-]+)\/([\w.-]+))?#(\d+)/gi;
            const issues = new Set();
            for (const m of body.matchAll(issueRef)) {
              if (m[1] && (m[1].toLowerCase() !== owner.toLowerCase() || m[2].toLowerCase() !== repo.toLowerCase())) {
                continue;
              }
              issues.add(Number(m[3]));
            }

            for (const number of issues) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (error) {
                core.warning(`Could not read #${number}: ${error.message}`);
                continue;
              }
              if (issue.pull_request || issue.milestone?.number === milestone.number) {
                continue;
              }
              if (issue.milestone && !pr.merged) {
                core.info(`#${number} is in ${issue.milestone.title}; it will move to ${milestone.title} when this PR merges.`);
                continue;
              }
              await github.rest.issues.update({ owner, repo, issue_number: number, milestone: milestone.number });
              core.info(`Set #${number} milestone to ${milestone.title}.`);
            }
